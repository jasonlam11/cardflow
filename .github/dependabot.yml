# Ecosystems for npm get added here when the dashboard is created.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: maven
    directory: /services/ledger-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
  - package-ecosystem: maven
    directory: /services/authorization-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
  - package-ecosystem: pip
    directories: ["/simulator", "/tests/e2e"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
