# Ecosystems for pip and npm get added here as each service is created.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: maven
    directory: /services/ledger-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
