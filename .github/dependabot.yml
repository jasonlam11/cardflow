version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: maven
    directory: /services/ledger-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
  - package-ecosystem: maven
    directory: /services/authorization-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
  - package-ecosystem: pip
    directories: ["/simulator", "/tests/e2e", "/services/fraud-service"]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      testing:
        patterns: ["vitest", "@testing-library/*", "jsdom", "@playwright/test"]
