name: e2e

# The whole system: authorization -> outbox -> Kafka -> ledger, including a
# Kafka outage. Runs on every PR that touches a service, the stack, or the tests.
on:
  pull_request:
    paths:
      - services/**
      - simulator/**
      - tests/e2e/**
      - infra/**
      - docker-compose.yml
      - .github/workflows/e2e.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tests/e2e/requirements.txt
            simulator/requirements.txt

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run e2e tests
        working-directory: tests/e2e
        run: |
          pip install -r requirements.txt
          pytest -v

      - name: Simulator smoke run (200 charges)
        run: docker compose --profile sim run --rm --build simulator --cards 10 --charges 200 --rate 50

      # Held-out synthetic days through the live stack (fraud model in the loop). Small, so this
      # only proves the path works without errors; full metrics are recorded in PROGRESS.md.
      - name: Replay smoke run (fraud scoring end to end)
        working-directory: simulator
        run: |
          pip install -r requirements.txt
          python -m cardflow_sim dataset --out data/transactions.csv.gz
          python -m cardflow_sim replay --file data/transactions.csv.gz --max-cards 40 --warmup-days 3

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
