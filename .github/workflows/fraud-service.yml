name: fraud-service

on:
  pull_request:
    paths:
      - services/fraud-service/**
      - simulator/cardflow_sim/**
      - .github/workflows/fraud-service.yml
  push:
    branches: [main]
    paths:
      - services/fraud-service/**
      - simulator/cardflow_sim/**
      - .github/workflows/fraud-service.yml

permissions:
  contents: read

jobs:
  test:
    name: Unit tests + model quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/fraud-service/requirements*.txt
            simulator/requirements.txt

      - name: Install (CPU-only XGBoost)
        working-directory: services/fraud-service
        run: |
          sed 's/^xgboost==/xgboost-cpu==/' requirements.txt > requirements-ci.txt
          sed -i 's/^-r requirements.txt/-r requirements-ci.txt/' requirements-train.txt
          pip install -r requirements-dev.txt -r ../../simulator/requirements.txt

      - name: Generate the synthetic training dataset
        working-directory: simulator
        run: python -m cardflow_sim dataset --out data/transactions.csv.gz

      # Includes Postgres store tests (Testcontainers) and the quality gate: retrains
      # from scratch and fails if PR-AUC / recall / precision drop below the minimums
      - name: Tests
        working-directory: services/fraud-service
        env:
          FRAUD_TRAINING_DATA: ${{ github.workspace }}/simulator/data/transactions.csv.gz
        run: pytest -q
