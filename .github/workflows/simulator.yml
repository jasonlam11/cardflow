name: simulator

on:
  pull_request:
    paths:
      - simulator/**
      - .github/workflows/simulator.yml
  push:
    branches: [main]
    paths:
      - simulator/**
      - .github/workflows/simulator.yml

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: simulator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
