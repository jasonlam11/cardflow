name: security

# Dependency audits on every PR, plus an image scan of every service, weekly and on demand.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: new CVEs appear even when the code doesn't change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (npm + pip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
      - name: npm audit (dashboard)
        working-directory: dashboard
        # Blocks on anything that ships (runtime dependencies). Dev-only tooling (linters, test
        # runners) never reaches the image and processes only our own files, so it's reported, not blocking.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || echo "::warning::dev-only dependencies have advisories (not shipped); see npm audit"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: pip-audit (python services)
        # Accepted risks come from .trivyignore, the same list the image scan uses. pip-audit has no
        # expiry dates, so entries past their exp: date are dropped here and fail the audit again.
        run: |
          pip install pip-audit
          today=$(date +%F)
          ignores=$(awk -v today="$today" '/^[A-Z]/ { until = $2; sub(/^exp:/, "", until); if (until == "" || until >= today) printf "--ignore-vuln %s ", $1 }' .trivyignore)
          for f in services/fraud-service/requirements.txt services/assistant-service/requirements.txt simulator/requirements.txt; do
            echo "== $f"; pip-audit -r "$f" $ignores
          done

  image-scan:
    name: Image scan (${{ matrix.service }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [ledger-service, authorization-service, fraud-service, assistant-service, dashboard]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          dir=services/${{ matrix.service }}; [ -d "$dir" ] || dir=${{ matrix.service }}
          docker build -t cardflow/${{ matrix.service }}:scan "$dir"
      - name: Trivy (fail on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cardflow/${{ matrix.service }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
