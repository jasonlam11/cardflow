name: assistant-service

on:
  pull_request:
    paths:
      - services/assistant-service/**
      - .github/workflows/assistant-service.yml
  push:
    branches: [main]
    paths:
      - services/assistant-service/**
      - .github/workflows/assistant-service.yml
  # Real-model eval: manual only, because it costs money. Needs the ANTHROPIC_API_KEY repo secret.
  workflow_dispatch:
    inputs:
      model:
        description: Claude model id
        default: claude-haiku-4-5

permissions:
  contents: read

jobs:
  test:
    name: Unit tests + demo eval (no LLM cost)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/assistant-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/assistant-service/requirements*.txt
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements-dev.txt
      - name: Tests (incl. pgvector store via Testcontainers)
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
        run: pytest -q
      # Free: DemoLLM exercises retrieval, tools, guardrails and scoring. Fails if any
      # benefits question's expected section isn't retrieved.
      - name: Demo eval (pipeline + retrieval recall gate)
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
        run: python -m evals.run --out /tmp/eval-results.md --min-recall 1.0

  real-model-eval:
    name: Real-model eval (manual, paid)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/assistant-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/assistant-service/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Eval against Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run --provider anthropic --model "${{ inputs.model }}" --confirm-cost --out /tmp/eval-results.md
      - uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: /tmp/eval-results.*
