name: cardflow

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: cardflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      # Per-service credentials, consumed by infra/postgres/init scripts
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set in .env}
      AUTHORIZATION_DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD:?set in .env}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18+ images store data under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
