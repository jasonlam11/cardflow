name: cardflow

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: cardflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      # Per-service credentials, consumed by infra/postgres/init scripts
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set in .env}
      AUTHORIZATION_DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD:?set in .env}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?set in .env}
      FRAUD_DB_PASSWORD: ${FRAUD_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18+ images store data under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: cardflow-kafka
    environment:
      # Single node acting as both broker and KRaft controller (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # base64 UUID; any fixed value works locally
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:29092). EXTERNAL: your Mac (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so internal topics can only have one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly so a typo can't silently create one
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: creates topics explicitly (auto-creation is disabled), then exits
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: cardflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in transactions.authorized transactions.authorized.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  fraud-service:
    build: ./services/fraud-service
    image: cardflow/fraud-service:local
    container_name: cardflow-fraud
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: fraud
      DB_USER: fraud_svc
      DB_PASSWORD: ${FRAUD_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${FRAUD_PORT:-8083}:8083"
    restart: unless-stopped

  authorization-service:
    build: ./services/authorization-service
    image: cardflow/authorization-service:local
    container_name: cardflow-authorization
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_NAME: authorization
      DB_USER: authorization_svc
      DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # No depends_on for fraud-service on purpose: authorization keeps working
      # (rules fallback) when fraud-service is down or still starting
      FRAUD_URL: http://fraud-service:8083
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set in .env}
    ports:
      - "127.0.0.1:${AUTHORIZATION_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ledger-service:
    build: ./services/ledger-service
    image: cardflow/ledger-service:local
    container_name: cardflow-ledger
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_NAME: ledger
      DB_USER: ledger_svc
      DB_PASSWORD: ${LEDGER_DB_PASSWORD:?set in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # JSON log lines (Elastic Common Schema), including the correlation ID from the MDC
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "127.0.0.1:${LEDGER_PORT:-8081}:8081"
    healthcheck:
      # Alpine's BusyBox wget (the image has no curl or bash)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  assistant-service:
    build: ./services/assistant-service
    image: cardflow/assistant-service:local
    container_name: cardflow-assistant
    depends_on:
      postgres:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: assistant
      DB_USER: assistant_svc
      DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?set in .env}
      LEDGER_URL: http://ledger-service:8081
      # auto = Claude if ANTHROPIC_API_KEY is set, otherwise the free demo model
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-auto}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-haiku-4-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:-8084}:8084"
    restart: unless-stopped

  # The only service meant to face users (and, in AWS, the internet)
  dashboard:
    build: ./dashboard
    image: cardflow/dashboard:local
    container_name: cardflow-dashboard
    depends_on:
      authorization-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    environment:
      AUTHORIZATION_URL: http://authorization-service:8082
      LEDGER_URL: http://ledger-service:8081
      ASSISTANT_URL: http://assistant-service:8084
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set in .env}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    restart: unless-stopped

  # Not started by `make up`; run with `make simulate`
  simulator:
    build: ./simulator
    image: cardflow/simulator:local
    profiles: ["sim"]
    depends_on:
      authorization-service:
        condition: service_healthy
    environment:
      AUTHORIZATION_URL: http://authorization-service:8082
    restart: "no"

volumes:
  postgres-data:
  kafka-data:
