spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER:ledger_svc}
    password: ${DB_PASSWORD:}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # One consumer thread per partition of transactions.authorized (3). Events are keyed by
      # card, so each card's events stay in order; account creation is conflict-safe.
      # Measured: 1 thread left approval->ledger at p95 5.5 s under 600 req/s.
      concurrency: 3
    consumer:
      group-id: ledger-service
      # A brand-new consumer group starts from the oldest retained event, not "now"
      auto-offset-reset: earliest
    producer:
      # Used only to publish failed events to the dead-letter topic
      acks: all

server:
  port: ${PORT:8081}
  error:
    # Never leak stack traces or exception messages to API clients
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Internal network only (not published in AWS); Prometheus scrapes /actuator/prometheus
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets so p95/p99 latency can be computed from Prometheus data
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # Spring Boot adds this to every log line; filled from the MDC by CorrelationIdFilter
    correlation: "[%X{correlationId:-}] "

cardflow:
  events:
    topic: transactions.authorized
