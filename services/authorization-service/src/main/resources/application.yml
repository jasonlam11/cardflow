spring:
  application:
    name: authorization-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authorization}
    username: ${DB_USER:authorization_svc}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for the broker to durably store each event, and let the client
      # retry without creating duplicates on the broker
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

server:
  port: ${PORT:8082}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

cardflow:
  admin:
    # Required for dashboard endpoints; empty = admin endpoints closed
    api-key: ${ADMIN_API_KEY:}
  fraud:
    url: ${FRAUD_URL:http://localhost:8083}
    # Authorization waits at most ~0.5 s for fraud-service, then falls back to rules
    connect-timeout-ms: 200
    read-timeout-ms: 300
    # Open the circuit when >= 50% of the last 20 calls failed (after at least 10);
    # stay open 10 s, then let 3 test calls through
    circuit-window-size: 20
    circuit-minimum-calls: 10
    circuit-failure-rate-percent: 50
    circuit-open-seconds: 10
    circuit-half-open-calls: 3
  outbox:
    topic: transactions.authorized
    poll-interval-ms: 500
    batch-size: 100
    send-timeout-ms: 10000

logging:
  pattern:
    # Spring Boot adds this to every log line; filled from the MDC by CorrelationIdFilter
    correlation: "[%X{correlationId:-}] "
